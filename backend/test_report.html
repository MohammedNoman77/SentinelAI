  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 40px; }
  .header { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; padding: 30px; border-radius: 12px; margin-bottom: 30px; }

  .meta-item { padding: 12px; background: #f9fafb; border-radius: 8px; }
  .meta-label { font-size: 11px; color: #6b7280; text-transform: uppercase; margin-bottom: 4px; }
  .meta-value { font-size: 14px; font-weight: 600; }

  .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #06b6d4; }
  .stat-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .stat-value { font-size: 32px; font-weight: bold; color: #0B1120; }

  .section h2 { font-size: 18px; margin-bottom: 16px; color: #0B1120; border-bottom: 2px solid #06b6d4; padding-bottom: 8px; }
  .section p { font-size: 14px; line-height: 1.6; color: #4b5563; margin-bottom: 10px; }
  .footer { text-align: center; padding: 20px; color: #6b7280; font-size: 12px; margin-top: 30px; }
</style>
</head>
